<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>dsh-cover · 版式 A</title>
<style>
/* ============ 字体层 ============ */
@font-face{
  font-family:'NotoSansSC';
  src:url('file:///C:/Windows/Fonts/NotoSansSC-VF.ttf') format('truetype');
  font-weight:100 900; font-style:normal; font-display:block;
}
@font-face{
  font-family:'YaHeiBd';
  src:url('file:///C:/Windows/Fonts/msyhbd.ttc') format('truetype');
  font-weight:700;
}
:root{
  /* 三色系统（来自封面参考实测） */
  --red:#C41E1B;
  --navy:#0B2A5B;
  --blue:#12368F;
  --ink:#111111;
  --grey:#999999;
  --pink:#FDEDED;
  --sky:#EAF1FA;
  --paper:#FFFFFF;

  --W:1086px;
  --H:1448px;
  --pad:20px;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{background:#555;}
body{display:flex;justify-content:center;align-items:flex-start;padding:0;}

/* ============ 画布 ============ */
.cover{
  position:relative;
  width:var(--W); height:var(--H);
  background:var(--paper);
  overflow:hidden;
  font-family:'NotoSansSC','YaHeiBd','Microsoft YaHei',sans-serif;
  color:var(--ink);
  display:flex; flex-direction:column;
  padding:var(--pad);
}

/* ============ 1. 刊头栏（加大 · 只放 logo + 项目名称） ============ */
.masthead{
  height:96px; flex:0 0 96px;
  display:flex; align-items:center; gap:22px;
}
.masthead .logo{
  width:82px; height:82px; flex:0 0 82px;
  border-radius:14px; object-fit:cover;
  background:var(--navy);
  box-shadow:0 3px 0 rgba(11,42,91,.18);
}
.masthead .name{
  font-size:60px; font-weight:900; letter-spacing:-.01em;
  line-height:1; color:var(--ink);
  white-space:nowrap;
}
.masthead .name em{font-style:normal;color:var(--navy);}

/* 藏蓝粗分隔线 */
.rule-navy{
  flex:0 0 8px; height:8px; background:var(--navy);
  margin:12px 0 0 0;
}

/* ============ 2. 主标题区 ============ */
.headline-zone{
  flex:1 1 auto;
  display:flex; gap:18px;
  align-items:center;              /* 垂直居中，消除标题下方大片留白 */
  padding-top:26px;
  min-height:0;
}
.headline{flex:1 1 auto; display:flex; flex-direction:column; justify-content:center;}

/* 每行 flex 两端对齐 → 字数少的行自动加宽，各行总宽一致 */
.hl{
  display:flex; justify-content:space-between; align-items:baseline;
  width:100%; line-height:1.0;
  font-size:88px; font-weight:900; letter-spacing:-.02em;
  margin-bottom:18px;
}
.hl:last-child{margin-bottom:0;}
.hl span{display:inline-block;}
.hl .red{color:var(--red);}
.hl .blue{color:var(--blue);}

/* 图标层 · 右上角主视觉（代码绘制：电路板 + 插件模块 + 红箭头） */
.hero-art{
  flex:0 0 372px; width:372px; height:330px;
  border-radius:8px; overflow:hidden; background:var(--navy);
}
.hero-art svg{display:block;width:100%;height:100%;}

/* ============ 导语 ============ */
.deck{
  flex:0 0 auto;
  font-size:32px; font-weight:500; line-height:1.3;
  color:var(--ink);
  padding:16px 0 14px 0;
}
.deck em{font-style:normal;font-weight:900;color:var(--red);}
.rule-red{flex:0 0 4px;height:4px;background:var(--red);}

/* ============ 3. 三栏内容框 ============ */
.panels{
  flex:0 0 372px;
  display:grid; grid-template-columns:1fr 1fr 1fr; gap:0;
  margin-top:20px;
}
.panel{
  display:flex; flex-direction:column;
  border:1px solid rgba(11,42,91,.16);
}
.panel.p1{background:var(--pink);}
.panel.p2{background:#FFFFFF;}
.panel.p3{background:var(--sky);}
.panel + .panel{border-left:none;}

.panel-head{
  height:58px; display:flex; align-items:center; gap:12px;
  padding:0 16px; color:#fff;
}
.p1 .panel-head{background:var(--red);}
.p2 .panel-head{background:var(--navy);}
.p3 .panel-head{background:var(--red);}
.panel-head .no{font-size:30px;font-weight:900;letter-spacing:.02em;}
.panel-head .div{width:1px;height:26px;background:rgba(255,255,255,.75);}
.panel-head .label{font-size:30px;font-weight:900;}

.panel-body{
  flex:1 1 auto; display:flex; flex-direction:column;
  align-items:flex-start; justify-content:flex-start;
  padding:22px 18px 18px 18px; gap:10px;
}
.panel-body .icon{width:68px;height:68px;margin-bottom:6px;}
.panel-body .icon svg{width:100%;height:100%;display:block;fill:var(--red);}
.panel.p2 .panel-body .icon svg{fill:var(--navy);}
.panel-body .big{
  font-size:82px; font-weight:900; color:var(--red);
  line-height:.95; letter-spacing:-.03em;
}
.panel.p2 .panel-body .big{color:var(--navy);}
.panel-body .txt{font-size:24px;line-height:1.42;color:var(--ink);font-weight:500;}

/* ============ 4. 底部警示条：红方块 + 白圈 + 加粗惊叹号 ============ */
.alert{
  flex:0 0 158px; margin-top:20px;
  border:4px solid var(--red); background:#fff;
  display:flex; align-items:stretch;
}
/* 红色正方形底 */
.alert-badge{
  flex:0 0 158px; width:158px;
  background:var(--red);
  display:flex; align-items:center; justify-content:center;
}
/* 白色的圈 */
.alert-circle{
  width:106px; height:106px; border-radius:50%;
  background:#fff;
  display:flex; align-items:center; justify-content:center;
}
/* 加粗的惊叹号 */
.alert-circle .bang{
  font-size:82px; font-weight:900; color:var(--red);
  line-height:1; transform:translateY(-4px);
  font-family:'NotoSansSC','YaHeiBd',sans-serif;
}
.alert-text{
  flex:1 1 auto; display:flex; flex-direction:column; justify-content:center;
  padding:0 26px; gap:2px;
}
.alert-text .l1{font-size:44px;font-weight:900;line-height:1.14;}
.alert-text .l1 em{font-style:normal;color:var(--red);}

/* ============ 页脚 ============ */
.footer{
  flex:0 0 46px; display:flex; align-items:flex-end;
  border-top:1px solid #E3E3E3; margin-top:auto;
  padding-top:10px;
  font-size:21px; color:var(--grey); font-weight:500;
}
</style>
</head>
<body>
<div class="cover" id="cover">

  <!-- ===== 1. 刊头栏 ===== -->
  <header class="masthead">
    <img class="logo" src="assets/logo-deepseek-ai.png" alt="DeepSeek">
    <div class="name">DeepSeek <em>Harness</em></div>
  </header>
  <div class="rule-navy"></div>

  <!-- ===== 2. 主标题区 ===== -->
  <section class="headline-zone">
    <h1 class="headline" id="headline" data-lines="DSH插件生态|精选 4412 个|23个分类|一条命令就能装"></h1>

    <div class="hero-art">
      <svg viewBox="0 0 372 330" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#0E2F63"/>
            <stop offset="100%" stop-color="#061733"/>
          </linearGradient>
          <linearGradient id="arrow" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#E23B33"/>
            <stop offset="100%" stop-color="#B0180F"/>
          </linearGradient>
        </defs>
        <rect width="372" height="330" fill="url(#bg)"/>
        <!-- 电路走线 -->
        <g stroke="#2E5FA8" stroke-width="2" opacity=".55" fill="none">
          <path d="M0 60 H120 V150 H250"/>
          <path d="M0 150 H70 V250 H200"/>
          <path d="M372 90 H280 V190 H150"/>
          <path d="M372 240 H300 V300 H180"/>
          <path d="M60 0 V70 H160"/>
          <path d="M240 0 V50 H330"/>
        </g>
        <g fill="#2E5FA8" opacity=".7">
          <circle cx="120" cy="60" r="4"/><circle cx="70" cy="150" r="4"/>
          <circle cx="280" cy="90" r="4"/><circle cx="300" cy="240" r="4"/>
        </g>
        <!-- 插件模块阵列 -->
        <g id="tiles"></g>
        <!-- 红色向上箭头 -->
        <g transform="translate(196,150)">
          <path d="M40 0 L86 62 H58 V128 H22 V62 H-6 Z" fill="url(#arrow)"/>
          <path d="M40 0 L86 62 H58 V128 H22 V62 H-6 Z" fill="none" stroke="#7E0F09" stroke-width="2"/>
        </g>
      </svg>
    </div>
  </section>

  <!-- ===== 导语 ===== -->
  <div class="deck">万物皆插件，从 UI 到记忆层，全都能换。</div>
  <div class="rule-red"></div>

  <!-- ===== 3. 三栏内容框 ===== -->
  <section class="panels">
    <div class="panel p1">
      <div class="panel-head"><span class="no">01</span><span class="div"></span><span class="label">收录规模</span></div>
      <div class="panel-body">
        <div class="icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><path d="m8.878.392 5.25 3.045c.54.314.872.89.872 1.514v6.098a1.75 1.75 0 0 1-.872 1.514l-5.25 3.045a1.75 1.75 0 0 1-1.756 0l-5.25-3.045A1.75 1.75 0 0 1 1 11.049V4.951c0-.624.332-1.201.872-1.514L7.122.392a1.75 1.75 0 0 1 1.756 0ZM7.875 1.69l-4.63 2.685L8 7.133l4.755-2.758-4.63-2.685a.248.248 0 0 0-.25 0ZM2.5 5.677v5.372c0 .09.047.171.125.216l4.625 2.683V8.432Zm6.25 8.271 4.625-2.683a.25.25 0 0 0 .125-.216V5.677L8.75 8.432Z"/></svg></div>
        <div class="big">4412</div>
        <div class="txt">插件已收录<br>且持续更新</div>
      </div>
    </div>
    <div class="panel p2">
      <div class="panel-head"><span class="no">02</span><span class="div"></span><span class="label">分类结构</span></div>
      <div class="panel-body">
        <div class="icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><path d="M7.122.392a1.75 1.75 0 0 1 1.756 0l5.003 2.902c.83.481.83 1.68 0 2.162L8.878 8.358a1.75 1.75 0 0 1-1.756 0L2.119 5.456a1.251 1.251 0 0 1 0-2.162ZM8.125 1.69a.248.248 0 0 0-.25 0l-4.63 2.685 4.63 2.685a.248.248 0 0 0 .25 0l4.63-2.685ZM1.601 7.789a.75.75 0 0 1 1.025-.273l5.249 3.044a.248.248 0 0 0 .25 0l5.249-3.044a.75.75 0 0 1 .752 1.298l-5.248 3.044a1.75 1.75 0 0 1-1.756 0L1.874 8.814A.75.75 0 0 1 1.6 7.789Zm0 3.5a.75.75 0 0 1 1.025-.273l5.249 3.044a.248.248 0 0 0 .25 0l5.249-3.044a.75.75 0 0 1 .752 1.298l-5.248 3.044a1.75 1.75 0 0 1-1.756 0l-5.248-3.044a.75.75 0 0 1-.273-1.025Z"/></svg></div>
        <div class="big">23</div>
        <div class="txt">从 UI 到记忆层<br>覆盖全链路</div>
      </div>
    </div>
    <div class="panel p3">
      <div class="panel-head"><span class="no">03</span><span class="div"></span><span class="label">使用方式</span></div>
      <div class="panel-body">
        <div class="icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><path d="M0 2.75C0 1.784.784 1 1.75 1h12.5c.966 0 1.75.784 1.75 1.75v10.5A1.75 1.75 0 0 1 14.25 15H1.75A1.75 1.75 0 0 1 0 13.25Zm1.75-.25a.25.25 0 0 0-.25.25v10.5c0 .138.112.25.25.25h12.5a.25.25 0 0 0 .25-.25V2.75a.25.25 0 0 0-.25-.25ZM7.25 8a.749.749 0 0 1-.22.53l-2.25 2.25a.749.749 0 0 1-1.275-.326.749.749 0 0 1 .215-.734L5.44 8 3.72 6.28a.749.749 0 0 1 .326-1.275.749.749 0 0 1 .734.215l2.25 2.25c.141.14.22.331.22.53Zm1.5 1.5h3a.75.75 0 0 1 0 1.5h-3a.75.75 0 0 1 0-1.5Z"/></svg></div>
        <div class="big">1</div>
        <div class="txt">一条命令<br>dsh plugin add</div>
      </div>
    </div>
  </section>

  <!-- ===== 4. 底部警示条 ===== -->
  <section class="alert">
    <div class="alert-badge">
      <div class="alert-circle"><span class="bang">!</span></div>
    </div>
    <div class="alert-text">
      <div class="l1">万物皆插件，<em>4412</em> 个已经就位。</div>
    </div>
  </section>

  <footer class="footer">数据来源：awesome-dsh-plugin.com ｜ 免责声明：本文内容仅供参考，不构成任何投资建议。</footer>
</div>

<script>
/* 文字层：把每行拆成单字 span，配合 flex space-between 实现"字数少的行自动加宽" */
(function () {
  const h = document.getElementById('headline');
  const RED  = new Set(['4412', '个']);   // 需要标红的片段
  const BLUE = new Set(['23']);

  h.dataset.lines.split('|').forEach(function (line, li) {
    const row = document.createElement('div');
    row.className = 'hl';

    // 先按"词块"切：数字/英文连在一起，中文逐字
    const tokens = line.match(/[0-9A-Za-z.]+|\s+|./gu) || [];

    tokens.forEach(function (t) {
      const s = document.createElement('span');
      s.textContent = t;
      if (t.trim() === '') { s.style.flex = '0 0 auto'; }
      if (li === 1 && t === '4412') s.classList.add('red');
      if (li === 2 && t === '23')   s.classList.add('blue');
      row.appendChild(s);
    });
    h.appendChild(row);
  });

  /* 图标层：用 JS 程序化生成插件模块阵列（避免手写几百个 rect） */
  const tiles = document.getElementById('tiles');
  const SVGNS = 'http://www.w3.org/2000/svg';
  const COLS = 6, ROWS = 5, S = 34, GAP = 14, X0 = 26, Y0 = 26;
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const x = X0 + c * (S + GAP), y = Y0 + r * (S + GAP);
      const g = document.createElementNS(SVGNS, 'g');
      // 模块本体
      const rect = document.createElementNS(SVGNS, 'rect');
      rect.setAttribute('x', x); rect.setAttribute('y', y);
      rect.setAttribute('width', S); rect.setAttribute('height', S);
      rect.setAttribute('rx', 6);
      rect.setAttribute('fill', '#16386F');
      rect.setAttribute('stroke', '#3E6FBF');
      rect.setAttribute('stroke-width', '2');
      g.appendChild(rect);
      // 发光核心
      const core = document.createElementNS(SVGNS, 'rect');
      core.setAttribute('x', x + 9); core.setAttribute('y', y + 9);
      core.setAttribute('width', S - 18); core.setAttribute('height', S - 18);
      core.setAttribute('rx', 3);
      core.setAttribute('fill', '#8FC3FF');
      core.setAttribute('opacity', '0.9');
      g.appendChild(core);
      tiles.appendChild(g);
    }
  }
})();
</script>
</body>
</html>
